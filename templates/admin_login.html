<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - JobGuard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            JobGuard
        </div>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('analyze') }}">
                Analyze Job
            </a>

            <a href="{{ url_for('history') }}">
                History
            </a>

            <a href="{{ url_for('safety') }}">
                Safety Guide
            </a>

            <a href="{{ url_for('about') }}">
                About
            </a>

        </div>

    </nav>


    <!-- Login Section -->

    <section class="login-section">

        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    🛡️
                </div>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Login to manage JobGuard data and reports.
                </p>

            </div>


            <!-- Login Form -->

            <form
                action="{{ url_for('admin_login') }}"
                method="POST"
                class="login-form">


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required>

                </div>


                {% if error %}

                <div class="error-message">

                    {{ error }}

                </div>

                {% endif %}


                <button
                    type="submit"
                    class="login-submit">

                    Login

                </button>


            </form>


            <div class="login-footer">

                <a href="{{ url_for('home') }}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 JobGuard. Admin Panel.
        </p>

    </footer>


</body>

</html>
